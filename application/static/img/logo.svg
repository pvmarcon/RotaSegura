<svg width="600" height="120" viewBox="0 0 600 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes stretchAndRetract {
      0% {
        /* Estado inicial: rota curta sob a marca */
        x: 2px;
        y: 50px;
        width: 24px;
        opacity: 1;
      }
      35% {
        /* A rota se estende sob o nome */
        x: 2px;
        y: 50px;
        width: 235px;
        opacity: 1;
      }
      50% {
        /* Pausa sutil com a rota totalmente estendida */
        x: 2px;
        y: 50px;
        width: 235px;
        opacity: 1;
      }
      85% {
        /* A rota retorna ao ponto inicial */
        x: 213px;
        y: 50px;
        width: 24px;
        opacity: 1;
      }
      92% {
        /* A rota some suavemente */
        x: 235px;
        y: 50px;
        width: 0px;
        opacity: 0;
      }
      93% {
        /* Retorna invisível para o ponto de partida */
        x: 2px;
        y: 50px;
        width: 24px;
        opacity: 0;
      }
      100% {
        /* Reaparece no início e reinicia o loop */
        x: 2px;
        y: 50px;
        width: 24px;
        opacity: 1;
      }
    }

    .expanding-bar {
      animation: stretchAndRetract 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <g transform="translate(10, 20) scale(1.4)">
    <!-- Texto "rota" -->
    <path d="M4 30V12h18M4 30h18V12" stroke="#FF7A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="4" cy="30" r="3.5" fill="#FF7A00" />
    <circle cx="22" cy="12" r="3.5" fill="#FF7A00" />

    <!-- Nome da marca -->
    <text x="38" y="40" fill="#FFFFFF" font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="38" letter-spacing="-1">Rota</text>
    <text x="143" y="40" fill="#FFFFFF" font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="38" letter-spacing="-1">Segura</text>

    <!-- Rota laranja com animação de expansão e retração -->
    <rect class="expanding-bar" x="38" y="48" width="24" height="4" fill="#FF7A00" rx="1" />
  </g>
</svg>