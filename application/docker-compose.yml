x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: python:3.12-slim
    container_name: bus_app
    restart: unless-stopped
    logging: *default-logging
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "8001:8000"
    env_file:
      - .env
    environment:
      DOCKER_CONTAINER: "1"
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      APP_BASE_URL: http://localhost:8000
      GRAFANA_URL: http://localhost:3000
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - grafana
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"

  worker:
    image: python:3.12-slim
    container_name: bus_worker
    restart: unless-stopped
    logging: *default-logging
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DOCKER_CONTAINER: "1"
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      - postgres
      - rabbitmq
      - redis
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python worker.py"

  postgres:
    image: postgres:15-alpine
    container_name: bus_postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: smart_cities_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bus_rabbitmq
    restart: always
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
      - "5552:5552"

  redis:
    image: redis:7-alpine
    container_name: bus_redis
    restart: always
    logging: *default-logging
    ports:
      - "6379:6379"

  grafana:
    image: grafana/grafana:latest
    container_name: bus_grafana
    restart: always
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - postgres

  loki:
    image: grafana/loki:latest
    container_name: bus_loki
    restart: always
    logging: *default-logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  postgres_data:
  grafana_data: