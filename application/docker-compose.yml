services:
  # Banco de dados
  postgres:
    image: postgres:15-alpine
    container_name: bus_postgres
    restart: always
    environment:
      POSTGRES_DB: smart_cities_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bus_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Porta de comunicação da API/Worker
      - "15672:15672" # Painel visual no navegador

  # Redis
  redis:
    image: redis:7-alpine
    container_name: bus_redis
    restart: always
    ports:
      - "6379:6379"

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: bus_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres

  # Loki
  loki:
    image: grafana/loki:latest
    container_name: bus_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # Cloudflare Tunnel
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: bus_tunnel
  #   restart: always
  #   command: tunnel --no-autoupdate run --token SEU_TOKEN_AQUI

# Declaração de volumes
volumes:
  postgres_data:
  grafana_data: